  - synthesizer
ReleaseNotes: |-
  La versión 1.0.9 incorpora un deslizador de línea de tiempo continuo en Canvas
  con arrastre táctil inmediato, restaura el efecto de estela y el desenfoque de
  movimiento en el Piano Roll y optimiza el motor determinista de reproducción
  con un índice temporal binario, alcanzando 144 FPS nativos. En Windows, la
  distribución se unifica en un instalador EXE generado con Inno Setup, instalado
  por usuario y sin elevación.
